name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The default package list includes 'tools', which current SDK command-line
      # tools no longer provide; the Android Gradle plugin fetches what else it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check committed Android project is in sync
        run: git diff --exit-code -- android/capacitor.settings.gradle android/app/capacitor.build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wildhaven-zoo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
